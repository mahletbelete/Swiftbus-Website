<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Persistence Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .step { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .log { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>
    <h1>🔍 Session Persistence Debug</h1>
    
    <div class="step">
        <h3>Step 1: Test Direct API Calls</h3>
        <button onclick="testDirectAPI()">Test API Connection</button>
        <div id="apiResult"></div>
    </div>
    
    <div class="step">
        <h3>Step 2: Test Login with Session Tracking</h3>
        <button onclick="testLoginWithTracking()">Login + Track Session</button>
        <div id="loginTrackResult"></div>
    </div>
    
    <div class="step">
        <h3>Step 3: Test Session Immediately After Login</h3>
        <button onclick="testSessionAfterLogin()">Test Session Persistence</button>
        <div id="sessionTestResult"></div>
    </div>
    
    <div class="step">
        <h3>Step 4: Test Multiple Session Checks</h3>
        <button onclick="testMultipleSessionChecks()">Multiple Session Checks</button>
        <div id="multipleSessionResult"></div>
    </div>
    
    <div class="step">
        <h3>Step 5: Test Admin Page Simulation</h3>
        <button onclick="simulateAdminPageLoad()">Simulate Admin Page Load</button>
        <div id="adminSimResult"></div>
    </div>
    
    <div class="step">
        <h3>Debug Log</h3>
        <button onclick="clearLog()">Clear Log</button>
        <div id="debugLog" class="log"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let logEntries = [];
        
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}`;
            logEntries.push({message: entry, type});
            
            const logDiv = document.getElementById('debugLog');
            const entryDiv = document.createElement('div');
            entryDiv.className = type;
            entryDiv.textContent = entry;
            logDiv.appendChild(entryDiv);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            console.log(entry);
        }
        
        function clearLog() {
            document.getElementById('debugLog').innerHTML = '';
            logEntries = [];
        }
        
        async function testDirectAPI() {
            const container = document.getElementById('apiResult');
            container.innerHTML = '<div class="warning">🔄 Testing API connection...</div>';
            
            try {
                // Test if API files exist
                const testUrl = swiftBusAPI.apiURL + '/auth.php?action=check_session';
                addLog(`Testing API URL: ${testUrl}`, 'info');
                
                const response = await fetch(testUrl);
                const text = await response.text();
                
                addLog(`API Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                addLog(`API Response Text: ${text.substring(0, 200)}...`, 'info');
                
                if (response.ok) {
                    try {
                        const json = JSON.parse(text);
                        container.innerHTML = `
                            <div class="success">
                                ✅ API Connection: SUCCESS<br>
                                Status: ${response.status}<br>
                                Response: ${JSON.stringify(json, null, 2)}
                            </div>
                        `;
                    } catch (e) {
                        container.innerHTML = `
                            <div class="error">
                                ❌ API Response not JSON<br>
                                Status: ${response.status}<br>
                                Text: ${text}
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = `
                        <div class="error">
                            ❌ API Connection: FAILED<br>
                            Status: ${response.status}<br>
                            Text: ${text}
                        </div>
                    `;
                }
            } catch (error) {
                addLog(`API Test Error: ${error.message}`, 'error');
                container.innerHTML = `<div class="error">❌ API Test Error: ${error.message}</div>`;
            }
        }
        
        async function testLoginWithTracking() {
            const container = document.getElementById('loginTrackResult');
            container.innerHTML = '<div class="warning">🔄 Testing login with session tracking...</div>';
            
            try {
                // Clear everything first
                addLog('🧹 Clearing all browser data...', 'info');
                localStorage.clear();
                sessionStorage.clear();
                
                // Test login
                addLog('🔐 Attempting login...', 'info');
                const loginResponse = await swiftBusAPI.login({
                    email: 'mubarekali974@gmail.com',
                    password: 'Admin@123'
                });
                
                addLog(`Login Response: ${JSON.stringify(loginResponse)}`, loginResponse.success ? 'success' : 'error');
                
                if (loginResponse.success) {
                    // Immediately test session
                    addLog('🔍 Testing session immediately after login...', 'info');
                    const sessionResponse = await swiftBusAPI.checkSession();
                    
                    addLog(`Session Response: ${JSON.stringify(sessionResponse)}`, sessionResponse.success ? 'success' : 'error');
                    
                    if (sessionResponse.success) {
                        container.innerHTML = `
                            <div class="success">
                                ✅ Login + Session: SUCCESS<br>
                                User: ${sessionResponse.data.name}<br>
                                Role: ${sessionResponse.data.role}<br>
                                Session persists correctly!
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <div class="error">
                                ❌ Login SUCCESS but Session FAILED<br>
                                Login: ${loginResponse.message}<br>
                                Session: ${sessionResponse.message}<br>
                                <strong>THIS IS THE PROBLEM!</strong>
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = `<div class="error">❌ Login Failed: ${loginResponse.message}</div>`;
                }
            } catch (error) {
                addLog(`Login Test Error: ${error.message}`, 'error');
                container.innerHTML = `<div class="error">❌ Login Test Error: ${error.message}</div>`;
            }
        }
        
        async function testSessionAfterLogin() {
            const container = document.getElementById('sessionTestResult');
            container.innerHTML = '<div class="warning">🔄 Testing session persistence...</div>';
            
            try {
                // Test session multiple times with delays
                const results = [];
                
                for (let i = 0; i < 5; i++) {
                    addLog(`Session check #${i + 1}...`, 'info');
                    const sessionResponse = await swiftBusAPI.checkSession();
                    results.push({
                        attempt: i + 1,
                        success: sessionResponse.success,
                        message: sessionResponse.message,
                        data: sessionResponse.data
                    });
                    
                    // Wait 500ms between checks
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                const successCount = results.filter(r => r.success).length;
                
                container.innerHTML = `
                    <div class="${successCount === 5 ? 'success' : 'error'}">
                        Session Persistence Test: ${successCount}/5 successful<br>
                        <pre>${JSON.stringify(results, null, 2)}</pre>
                    </div>
                `;
                
            } catch (error) {
                addLog(`Session Test Error: ${error.message}`, 'error');
                container.innerHTML = `<div class="error">❌ Session Test Error: ${error.message}</div>`;
            }
        }
        
        async function testMultipleSessionChecks() {
            const container = document.getElementById('multipleSessionResult');
            container.innerHTML = '<div class="warning">🔄 Testing multiple rapid session checks...</div>';
            
            try {
                // Make 10 rapid session checks
                const promises = [];
                for (let i = 0; i < 10; i++) {
                    promises.push(swiftBusAPI.checkSession());
                }
                
                addLog('Making 10 simultaneous session checks...', 'info');
                const results = await Promise.all(promises);
                
                const successCount = results.filter(r => r.success).length;
                
                container.innerHTML = `
                    <div class="${successCount === 10 ? 'success' : 'error'}">
                        Rapid Session Checks: ${successCount}/10 successful<br>
                        ${successCount < 10 ? '<strong>Session instability detected!</strong>' : 'Session is stable'}
                    </div>
                `;
                
            } catch (error) {
                addLog(`Multiple Session Test Error: ${error.message}`, 'error');
                container.innerHTML = `<div class="error">❌ Multiple Session Test Error: ${error.message}</div>`;
            }
        }
        
        async function simulateAdminPageLoad() {
            const container = document.getElementById('adminSimResult');
            container.innerHTML = '<div class="warning">🔄 Simulating admin page load...</div>';
            
            try {
                addLog('🎭 Simulating admin page load sequence...', 'info');
                
                // Step 1: Check session (like admin page does)
                addLog('Step 1: Initial session check...', 'info');
                const sessionCheck1 = await swiftBusAPI.checkSession();
                
                if (!sessionCheck1.success) {
                    container.innerHTML = `
                        <div class="error">
                            ❌ Admin Page Simulation: FAILED at step 1<br>
                            Session check failed: ${sessionCheck1.message}<br>
                            <strong>This would cause redirect to login!</strong>
                        </div>
                    `;
                    return;
                }
                
                // Step 2: Call authManager.requireAdmin (like admin pages do)
                addLog('Step 2: authManager.requireAdmin()...', 'info');
                const adminCheck = await authManager.checkAuth();
                
                if (!adminCheck || adminCheck.role !== 'admin') {
                    container.innerHTML = `
                        <div class="error">
                            ❌ Admin Page Simulation: FAILED at step 2<br>
                            Admin check failed: ${adminCheck ? adminCheck.role : 'null'}<br>
                            <strong>This would cause redirect to login!</strong>
                        </div>
                    `;
                    return;
                }
                
                // Step 3: Final session check
                addLog('Step 3: Final session check...', 'info');
                const sessionCheck2 = await swiftBusAPI.checkSession();
                
                if (sessionCheck2.success && sessionCheck2.data.role === 'admin') {
                    container.innerHTML = `
                        <div class="success">
                            ✅ Admin Page Simulation: SUCCESS<br>
                            User: ${sessionCheck2.data.name}<br>
                            Role: ${sessionCheck2.data.role}<br>
                            <strong>Admin page should load without redirect!</strong>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="error">
                            ❌ Admin Page Simulation: FAILED at step 3<br>
                            Final session check failed<br>
                            <strong>This would cause redirect loop!</strong>
                        </div>
                    `;
                }
                
            } catch (error) {
                addLog(`Admin Simulation Error: ${error.message}`, 'error');
                container.innerHTML = `<div class="error">❌ Admin Simulation Error: ${error.message}</div>`;
            }
        }
        
        // Auto-start API test
        setTimeout(() => {
            testDirectAPI();
        }, 1000);
    </script>
</body>
</html>
