<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin APIs</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Admin API Tests</h1>
    
    <div class="test-section">
        <h2>Routes API Test</h2>
        <button onclick="testRoutesAPI()">Test Routes API</button>
        <div id="routesResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Schedules API Test</h2>
        <button onclick="testSchedulesAPI()">Test Schedules API</button>
        <div id="schedulesResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Dashboard API Test</h2>
        <button onclick="testDashboardAPI()">Test Dashboard API</button>
        <div id="dashboardResult" class="result"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let swiftBusAPI;
        
        document.addEventListener('DOMContentLoaded', async function() {
            // Wait for API to be available
            let attempts = 0;
            while (typeof SwiftBusAPI === 'undefined' && attempts < 10) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            
            if (typeof SwiftBusAPI !== 'undefined') {
                swiftBusAPI = new SwiftBusAPI();
                console.log('✅ SwiftBusAPI initialized');
            } else {
                console.error('❌ SwiftBusAPI not available');
            }
        });

        async function testRoutesAPI() {
            const resultDiv = document.getElementById('routesResult');
            resultDiv.innerHTML = 'Testing routes API...';
            
            try {
                const response = await swiftBusAPI.request('admin_routes.php?action=get_routes');
                console.log('Routes API Response:', response);
                
                if (response.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Routes API Success</h3>
                        <p><strong>Total Routes:</strong> ${response.data.length}</p>
                        <p><strong>Sample Route:</strong></p>
                        <pre>${JSON.stringify(response.data[0] || {}, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Routes API Failed</h3>
                        <p><strong>Message:</strong> ${response.message}</p>
                    `;
                }
            } catch (error) {
                console.error('Routes API Error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Routes API Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }

        async function testSchedulesAPI() {
            const resultDiv = document.getElementById('schedulesResult');
            resultDiv.innerHTML = 'Testing schedules API...';
            
            try {
                const response = await swiftBusAPI.request('admin_schedules.php?action=get_schedules');
                console.log('Schedules API Response:', response);
                
                if (response.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Schedules API Success</h3>
                        <p><strong>Total Schedules:</strong> ${response.data.length}</p>
                        <p><strong>Sample Schedule:</strong></p>
                        <pre>${JSON.stringify(response.data[0] || {}, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Schedules API Failed</h3>
                        <p><strong>Message:</strong> ${response.message}</p>
                    `;
                }
            } catch (error) {
                console.error('Schedules API Error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Schedules API Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }

        async function testDashboardAPI() {
            const resultDiv = document.getElementById('dashboardResult');
            resultDiv.innerHTML = 'Testing dashboard API...';
            
            try {
                const response = await swiftBusAPI.request('admin_dashboard.php?action=get_stats');
                console.log('Dashboard API Response:', response);
                
                if (response.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Dashboard API Success</h3>
                        <p><strong>Stats:</strong></p>
                        <pre>${JSON.stringify(response.data || {}, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Dashboard API Failed</h3>
                        <p><strong>Message:</strong> ${response.message}</p>
                    `;
                }
            } catch (error) {
                console.error('Dashboard API Error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Dashboard API Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
