<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 3px; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Simple API</h1>
    
    <button class="test-button" onclick="testSimpleAPI()">Test Simple Schedules API</button>
    <div id="result" class="result"></div>

    <script>
        async function testSimpleAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Testing...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('api/admin_schedules_simple.php?action=get_schedules');
                const text = await response.text();
                
                console.log('Raw response:', text);
                
                try {
                    const data = JSON.parse(text);
                    
                    if (data.success) {
                        resultDiv.className = 'result success';
                        resultDiv.textContent = `✅ Simple API Success!\n\nData Count: ${data.data ? data.data.length : 'N/A'}\n\nSample Response:\n${JSON.stringify(data, null, 2)}`;
                    } else {
                        resultDiv.className = 'result error';
                        resultDiv.textContent = `❌ Simple API Error:\n${data.message || 'Unknown error'}\n\nFull Response:\n${JSON.stringify(data, null, 2)}`;
                    }
                } catch (parseError) {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ JSON Parse Error:\n${parseError.message}\n\nRaw Response:\n${text}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Network Error:\n${error.message}`;
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            testSimpleAPI();
        };
    </script>
</body>
</html>
